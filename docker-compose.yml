version: "3.8"

services:
  blog_strapi_api:
    container_name: blog_strapi_api
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: blog-strapi
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "C:/Users/Ronielson Oliveira/Desktop/PostgressData:/var/lib/postgresql/data/pgdata"
    ports:
      - "5432:5432"
